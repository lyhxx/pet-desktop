name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $v -or $v -eq 'workflow_dispatch') { $v = '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish DesktopPet.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Package portable zip
        run: Compress-Archive -Path publish\* -DestinationPath DesktopPet-win-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\DesktopPet.iss'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet
          path: |
            DesktopPet-win-x64.zip
            dist\DesktopPet-Setup.exe

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $out = @()
          $capturing = $false
          foreach ($line in (Get-Content 'docs/CHANGELOG.md')) {
            if ($line -match '^##\s+\[([^\]]+)\]') {
              if ($capturing) { break }
              if ($matches[1] -eq $version) { $capturing = $true }
              continue
            }
            if ($capturing) { $out += $line }
          }
          if (-not $out) { $out = @("DesktopPet v$version") }
          ($out -join "`n").Trim() | Set-Content -Path release_notes.md -Encoding UTF8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DesktopPet v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: |
            DesktopPet-win-x64.zip
            dist/DesktopPet-Setup.exe
